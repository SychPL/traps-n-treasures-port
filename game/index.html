<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Traps 'n Treasures - nowa wersja</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090d; color: #7f8ca6; font: 13px Segoe UI, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; overflow: hidden }
  canvas { image-rendering: pixelated; background: #000; cursor: grab }
  #info { margin-top: 8px; text-align: center }
  #disks { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box;
    background: #1a2030ee; color: #d8dde8; border: 1px solid #4a5a80; border-radius: 6px; padding: 6px 10px; text-align: center; z-index: 9 }
  #disks b { display: inline-block; color: #e8c832; background: #2a3450; border: 1px solid #4a5a80; border-radius: 4px; padding: 3px 10px; margin: 4px; cursor: pointer; font-weight: normal }
  #disks i { color: #7f8ca6 } #disks a { color: #7f8ca6; text-decoration: none; margin-left: 8px } #disks.drop { border-color: #e8c832 }
</style>
</head>
<body>
<canvas id="c" width="320" height="211"></canvas>
<div id="info"></div>
<script>   // assety z wlasnych dyskietek (extractor/) przez sw.js; nie w aplikacji Capacitor ani z file://
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script src="hd.js"></script>
<script src="actors.js"></script>
<script src="touch.js"></script>
<script src="main.js"></script>
<script src="input.js"></script>
<script src="disks.js"></script>
</body>
</html>
