<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADF extractor prototype</title>
<style>
  body{margin:0;background:#10131a;color:#d8dde8;font:14px Segoe UI,sans-serif}
  main{max-width:720px;margin:16px auto;padding:0 16px}
  h1{color:#e8c832;font-size:20px}
  pre{white-space:pre-wrap;background:#1a2030;padding:8px;border-radius:6px}
  canvas{image-rendering:pixelated;width:512px;max-width:100%;background:#000}
</style>
</head>
<body>
<main>
  <h1>Traps 'n Treasures - ADF extractor (prototype)</h1>
  <p>Pick your own disk images (both at once is fine). Nothing leaves the browser.</p>
  <label>ADF files: <input id="adf" type="file" accept=".adf" multiple></label>
  <pre id="log"></pre>
  <canvas id="tiles" width="256" height="16" hidden></canvas>
</main>
<script type="module">
import { ppUnpack } from './ppdepack.js';

// Game data ranges (boot block and crack sectors excluded, so the PSG disk 1 and its [a] variant both match).
const DISKS = [
  {name: 'disk 1', lo: 0x3200, hi: 0x5D6D8, sha1: '21ea697fc7aea748ef15f341203e47733934f0a0'},
  {name: 'disk 2', lo: 0x3200, hi: 0xCA3E0, sha1: 'dd75f5794c5592e7dd2608e0448b69224a7db78d'},
];
const CHR_L1 = 0x2D5A4;                                // level 1 tiles + palette (PowerPacker file on disk 2)
const log = s => document.getElementById('log').textContent += s + '\n';
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

async function identify(adf) {
  if (adf.length !== 901120) return null;
  for (const d of DISKS)
    if (hex(await crypto.subtle.digest('SHA-1', adf.subarray(d.lo, d.hi))) === d.sha1) return d;
  return null;
}

// CHR!: "CHR!", planes.W, 0.W, 32 colours (12 bit), then 16x16 tiles, 5 planes x 32 B each (160 B per tile)
function drawTiles(chr) {
  const dv = new DataView(chr.buffer), n = (chr.length - 0x46) / 160 | 0;
  const pal = Array.from({length: 32}, (_, i) => dv.getUint16(6 + 2 * i));
  const cv = document.getElementById('tiles'), rows = Math.ceil(n / 16);
  cv.height = rows * 16; cv.hidden = false;
  const cx = cv.getContext('2d'), im = cx.createImageData(256, rows * 16);
  for (let t = 0; t < n; t++)
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++) {
        let c = 0;
        for (let p = 0; p < 5; p++) c |= (dv.getUint16(0x46 + t * 160 + p * 32 + y * 2) >> (15 - x) & 1) << p;
        const k = ((t >> 4) * 16 + y) * 256 * 4 + ((t & 15) * 16 + x) * 4, v = pal[c];
        im.data.set([(v >> 8 & 15) * 17, (v >> 4 & 15) * 17, (v & 15) * 17, 255], k);
      }
  cx.putImageData(im, 0, 0);
  return n;
}

document.getElementById('adf').onchange = async e => {
  document.getElementById('log').textContent = '';
  if (!crypto.subtle) return log('crypto.subtle is missing: open this page over https or http://localhost');
  for (const f of e.target.files) {
    const adf = new Uint8Array(await f.arrayBuffer()), d = await identify(adf);
    log(`${f.name}: ${d ? 'recognised as ' + d.name : 'unknown disk (only the PSG crack is supported)'}`);
    if (d?.name !== 'disk 2') continue;
    const t0 = performance.now(), chr = ppUnpack(adf, CHR_L1);
    const magic = String.fromCharCode(...chr.subarray(0, 4));
    log(`  unpacked $${CHR_L1.toString(16)}: ${magic}, ${chr.length} B in ${(performance.now() - t0).toFixed(1)} ms`);
    log(`  level 1 tile bank: ${drawTiles(chr)} tiles (CHR! palette, colour 1 = sky)`);
  }
};
</script>
</body>
</html>
